# ===================================================================
# BASE CONFIGURATION (application.yml)
# ===================================================================

spring:
  application:
    name: ${APP_NAME:Inbox}

  profiles:
    active: ${APP_ENV:dev}

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cache:
    type: redis

  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:inbox}

  redis:
    url: ${UPSTASH_REDIS_URL}
    timeout: 5000ms

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:inbox}
      auto-index-creation: true
    redis:
      url: ${UPSTASH_REDIS_URL}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-stacktrace: never

# ===================================================================
# CUSTOM APPLICATION PROPERTIES
# ===================================================================

app:
  name: ${APP_NAME:Inbox}
  environment: ${APP_ENV:dev}
  version: ${APP_VERSION:1.0.0}

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTI1NmJpdA==}
  accessTokenExpiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
  refreshTokenExpiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

media:
  upload-folder: inbox-media
  max-file-size: 10485760 # 10MB

cors:
  allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
